app = "sieve-portal"
primary_region = "iad"

[build]

[env]
  PORT = "3000"

[[mounts]]
  source = "sieve_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
